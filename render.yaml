services:
  - type: web
    name: milo-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: milo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: auto
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"

databases:
  - name: milo-db
    databaseName: milo_db
    user: milo_user
    plan: free
    region: oregon
